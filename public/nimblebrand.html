    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --green: #91ED2E; }

        /* ── Hero ── */
        .asset-hero {
            padding: 56px 0 40px;
            max-width: 760px;
        }

        .eyebrow {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            display: inline-block;
            padding-bottom: 8px;
            border-bottom: 4px solid var(--green);
            margin-bottom: 26px;
        }

        .asset-hero h1 {
            font-family: 'Roboto', sans-serif;
            font-size: 58px;
            font-weight: 900;
            line-height: 1.02;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .asset-hero .sub {
            font-family: 'Roboto', sans-serif;
            font-size: 22px;
            font-weight: 500;
            line-height: 1.35;
            letter-spacing: -0.3px;
            max-width: 640px;
            margin-bottom: 30px;
        }

        .asset-hero .sub a {
            color: #000;
            text-decoration: underline;
            text-decoration-color: var(--green);
            text-decoration-thickness: 3px;
            text-underline-offset: 3px;
        }

        .asset-hero .sub a:hover { text-decoration-color: #000; }

        .asset-hero .lead {
            font-family: 'Roboto Mono', monospace;
            font-size: 15px;
            line-height: 1.75;
            color: #333;
            max-width: 620px;
            margin-bottom: 34px;
        }

        /* ── Download button ── */
        .download-row {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .download-btn {
            font-family: 'Roboto Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: #000;
            color: #fff;
            text-decoration: none;
            padding: 18px 30px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: background 0.15s, transform 0.15s;
        }

        .download-btn:hover { background: var(--green); color: #000; transform: translateY(-1px); }
        .download-btn .arrow { font-size: 18px; line-height: 1; }

        .file-meta {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #777;
        }

        /* ── What's inside ── */
        .inside {
            padding: 30px 0 8px;
            max-width: 620px;
        }

        .inside h2 {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 3px solid var(--green);
            display: inline-block;
            margin-bottom: 22px;
        }

        .inside ul { list-style: none; }

        .inside li {
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #222;
            padding: 12px 0 12px 26px;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }

        .inside li:last-child { border-bottom: none; }

        .inside li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 16px;
            width: 11px;
            height: 11px;
            background: var(--green);
        }

        .inside li strong { font-weight: 700; }

        /* ── Bottom CTA ── */
        .cta-band {
            background: var(--green);
            margin: 40px -40px 0;
            padding: 32px 40px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .cta-band .price {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 40px;
            line-height: 1;
            letter-spacing: -1px;
        }

        .cta-band .price span {
            display: block;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.14em;
            margin-top: 6px;
        }

        .cta-band .book {
            text-align: right;
        }

        .cta-band .book a {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 24px;
            color: #000;
            text-decoration: none;
        }

        .cta-band .book a:hover { text-decoration: underline; }

        .cta-band .book p {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            margin-top: 6px;
        }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .frame { padding: 0 20px; }
            .asset-hero { padding: 36px 0 28px; }
            .asset-hero h1 { font-size: 36px; }
            .asset-hero .sub { font-size: 20px; }
            .cta-band { margin: 32px -20px 0; padding: 26px 20px; }
            .cta-band .book { text-align: left; }
            footer { padding: 16px 20px 0; }
        }
    </style>
</head>
<body>

    <div class="frame">

        <!-- Header -->
        <header>
            <a href="index.html">
                <div class="logo">
                    <img src="site-images/SVG/Asset 1.svg" alt="Mark Britt">
                </div>
            </a>
            <nav style="display:flex;gap:24px;">
                <a href="index.html#work">work</a>
                <a href="pricing.html">pricing</a>
                <a href="contact.html">contact</a>
            </nav>
        </header>

        <!-- Hero -->
        <section class="asset-hero">
            <span class="eyebrow slide-in">The Nimble Brand Guide</span>
            <h1 class="slide-in delay-1">Get a brand in 4 weeks for $15K.</h1>
            <p class="sub slide-in delay-2">Read the one-page rundown of the Nimble Brand Sprint. Book a 20 minute chat <a href="contact.html">here</a>.</p>
            <div class="download-row slide-in delay-3">
                <a class="download-btn" href="nimblebrand.pdf" download
                   onclick="gtag('event','download',{'event_category':'asset','event_label':'nimble_brand_guide'});">
                    <span class="arrow">&#8595;</span> Download the guide
                </a>
                <span class="file-meta">PDF &middot; 2 pages</span>
            </div>
        </section>

    </div><!-- end .frame -->

    <!-- Footer -->
    <footer>
        <p>Mark Britt &nbsp;·&nbsp; <a href="mailto:markhavenbritt@gmail.com">markhavenbritt@gmail.com</a></p>
        <div class="base-bar"></div>
    </footer>

    <!-- Scroll-in animation (matches site) -->
    <script>
        const io = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.slide-in').forEach(el => io.observe(el));
    </script>

</body>
</html>
