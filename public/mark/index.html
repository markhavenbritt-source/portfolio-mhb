:root {
    --paper: #f0f0f0;
    --ink: #000;
    --green: #91ED2E;
    --yellow: #ffc301;
    --red: #ff2a63;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: 'Roboto Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; }

/* ── Layout: centered headline over two cards ── */
body { justify-content: center; align-items: center; padding: 48px 40px 64px; }
.wrap { width: 100%; max-width: 1280px; }
.headline { text-align: center; padding: 0 0 36px; }
.headline h1 {
    font-family: 'Ark Sans', 'Roboto', sans-serif; font-weight: 500;
    font-size: 72px; line-height: 1; letter-spacing: -1px;
}

/* ── Doors ── */
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; }
.door { display: flex; flex-direction: column; position: relative; overflow: hidden; border: 1px solid #b9b9b9; background: var(--paper); transition: transform .25s ease, box-shadow .25s ease; }

.door__bar { height: 32px; }
.door--ymm .door__bar { background: var(--green); }
.door--mmc .door__bar { background: var(--yellow); }

.door__img { aspect-ratio: 600 / 252; overflow: hidden; background: #1c1c1c; }
.door__img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.76,0,.24,1); }
.door--ymm .door__img img { object-position: center 30%; }
.door--mmc .door__img img { object-position: center 40%; }

.door__band { background: #000; color: #fff; padding: 20px 32px; display: flex; gap: 14px; align-items: flex-start; min-height: 88px; }
.stars { display: flex; gap: 4px; flex-shrink: 0; }
.stars img { width: 22px; height: 22px; }
.door__band p { font-size: 12px; line-height: 1.6; font-weight: 700; }
.door--ymm .accent { color: var(--green); }
.door--mmc .accent { color: var(--yellow); }

.door__foot { padding: 26px 32px 28px; background: #fff; flex: 1; }
.door__kicker { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.door__kicker i { display: inline-block; width: 8px; height: 8px; }
.door--ymm .door__kicker i { background: var(--green); }
.door--mmc .door__kicker i { background: var(--red); }
.door__name { font-family: 'Ark Sans', 'Roboto', sans-serif; font-weight: 500; font-size: 38px; line-height: 1; letter-spacing: -.5px; margin-bottom: 16px; }
.enter {
    font-family: 'Roboto', sans-serif; font-weight: 300; font-size: 13px;
    border: 1px solid #000; padding: 6px 15px; display: inline-flex; align-items: center; gap: 9px;
    transition: background .15s, color .15s;
}
.enter svg { transition: transform .2s; }

/* Hover / focus */
.door:hover, .door:focus-visible { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.12); }
.door:hover .door__img img, .door:focus-visible .door__img img { transform: scale(1.04); }
.door--ymm:hover .enter, .door--ymm:focus-visible .enter { background: var(--green); }
.door--mmc:hover .enter, .door--mmc:focus-visible .enter { background: var(--yellow); }
.door:hover .enter svg, .door:focus-visible .enter svg { transform: translateX(4px); }
.door:focus-visible { outline: 2px solid #000; outline-offset: 3px; }

/* ── Tablet / phone ── */
@media (max-width: 1000px) { .doors { gap: 32px; } .door__name { font-size: 30px; } .headline h1 { font-size: 56px; } }
@media (max-width: 720px) {
    body { padding: 32px 16px 40px; align-items: stretch; }
    .headline { padding-bottom: 24px; }
    .headline h1 { font-size: 40px; }
    .doors { grid-template-columns: 1fr; gap: 24px; }
    .door__bar { height: 20px; }
    .door__band { padding: 16px 18px; min-height: 0; }
    .door__foot { padding: 18px 18px 22px; }
    .door__name { font-size: 25px; }
}
@media (prefers-reduced-motion: reduce) {
    .door, .door__img img { transition: none; }
    .door:hover { transform: none; }
}
</style>
</head>
