    <link rel="stylesheet" href="style.css">
    <style>

        /* ── Contact Section ── */
        .contact {
            padding: 60px 0 80px;
            max-width: 600px;
        }

        .contact h1 {
            font-family: 'Roboto', sans-serif;
            font-size: 60px;
            font-weight: 900;
            line-height: 1.0;
            margin-bottom: 30px;
        }

        .contact p {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #444;
        }

        /* ── Form ── */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        input[type="email"],
        textarea {
            width: 100%;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            padding: 12px 14px;
            border: 1px solid #000;
            background: #fff;
            color: #000;
            outline: none;
            border-radius: 0;
            appearance: none;
        }

        input[type="email"]:focus,
        textarea:focus {
            border-color: #000;
            background: #fff;
        }

        textarea {
            height: 160px;
            resize: vertical;
        }

        button[type="submit"] {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            letter-spacing: 0.06em;
            background: #000;
            color: #fff;
            border: none;
            padding: 14px 28px;
            cursor: pointer;
            align-self: flex-start;
            transition: background 0.15s;
        }

        button[type="submit"]:hover {
            background: #333;
        }


        /* ── Mobile ── */
        @media (max-width: 768px) {
            .frame {
                padding: 0 20px;
            }

            .contact h1 {
                font-size: 40px;
            }

            footer {
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="frame">

        <!-- Header -->
        <header>
            <a href="index.html">
                <div class="logo">
                    <img src="site-images/SVG/Asset 1.svg" alt="Mark Britt">
                </div>
            </a>
            <nav style="display:flex;gap:24px;">
                <a href="index.html">work</a>
                <a href="about.html">about</a>
                <a href="Britt_Mark_2026.pdf" target="_blank">resume</a>
            </nav>
        </header>

        <!-- Contact Form -->
        <section class="contact">
            <h1>Say hello.</h1>
            <p>Drop your email and a note — I'll get back to you.</p>

            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div>
                    <label for="email">Your email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
                </div>
                <button type="submit">Send it</button>
            </form>
        </section>

    </div><!-- end .frame -->

    <!-- Footer -->
    <footer>
        <p>Mark Britt &nbsp;·&nbsp; <a href="mailto:markhavenbritt@gmail.com">markhavenbritt@gmail.com</a></p>
        <div class="base-bar"></div>
    </footer>

</body>
