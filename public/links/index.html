<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Britt — Links</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Roboto+Mono:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: #888;
            color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        /* ── Card container ── */
        .card {
            width: 100%;
            max-width: 480px;
            background: #f0f0f0;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
        }

        /* ── Banner ── */
        .banner {
            width: 100%;
            position: relative;
            background: #7CFC00;
            height: 160px;
            overflow: hidden;
        }

        .banner-stars {
            position: absolute;
            top: -45px;
            right: -20px;
            display: flex;
            gap: 24px;
        }

        .banner-stars img {
            width: 120px;
            height: 120px;
        }

        .banner-bar {
            width: 100%;
            height: 40px;
            object-fit: cover;
            display: block;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 1;
        }

        /* ── Content area ── */
        .content {
            padding: 0 32px 48px;
        }

        /* ── Profile photo ── */
        .profile-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #fff;
            object-fit: cover;
            object-position: center top;
            margin-top: -90px;
            display: block;
            position: relative;
            z-index: 10;
        }

        .content h1 {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 36px;
            line-height: 1.0;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .content .tagline {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: #000;
        }

        /* ── Buttons ── */
        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 22px 24px;
            border-radius: 14px;
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        /* Filled style (dark) */
        .link-btn.filled {
            background: #000;
            color: #fff;
            border: 3px solid #000;
        }

        .link-btn.filled:hover {
            background: #7CFC00;
            color: #000;
            border-color: #7CFC00;
        }

        /* Filled style (LinkedIn green) */
        .link-btn.linkedin {
            background: #111;
            color: #7CFC00;
            border: 3px solid #111;
        }

        .link-btn.linkedin:hover {
            background: #7CFC00;
            color: #000;
            border-color: #7CFC00;
        }

        /* Outlined style */
        .link-btn.outlined {
            background: transparent;
            color: #000;
            border: 3px solid #000;
        }

        .link-btn.outlined:hover {
            background: #7CFC00;
            color: #000;
            border-color: #7CFC00;
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            body {
                padding: 0;
            }

            .card {
                border-radius: 0;
                min-height: 100vh;
            }

            .banner {
                height: 140px;
            }

            .banner-stars img {
                width: 100px;
                height: 100px;
            }

            .content {
                padding: 0 24px 32px;
            }

            .content h1 {
                font-size: 30px;
            }

            .link-btn {
                padding: 18px 20px;
                font-size: 14px;
            }

            .profile-photo {
                width: 110px;
                height: 110px;
                margin-top: -40px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Banner -->
        <div class="banner">
            <div class="banner-stars">
                <img src="../site-images/SVG/star.svg" alt="">
                <img src="../site-images/SVG/star.svg" alt="">
            </div>
            <img class="banner-bar" src="../site-images/linktreebar@2x.png" alt="">
        </div>

        <!-- Content -->
        <div class="content">
            <img class="profile-photo" src="../site-images/li_profile@2x.png" alt="Mark Britt">

            <h1>Mark Britt</h1>
            <p class="tagline">Design player-coach. Pragmatist.<br>Problem-solver. People person. Creative.</p>

            <div class="links">
                <a class="link-btn filled" href="https://yourmanmark.com" target="_blank">DESIGN</a>
                <a class="link-btn linkedin" href="https://www.linkedin.com/in/markhavenbritt/" target="_blank">LINKEDIN</a>
                <a class="link-btn outlined" href="https://twinstarcomics.com" target="_blank">TWIN STAR</a>
                <a class="link-btn outlined" href="https://markhavenbritt.net" target="_blank">COMICS / ART</a>
            </div>
        </div>

    </div>

</body>
</html>
